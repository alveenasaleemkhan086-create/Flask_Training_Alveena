<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #eef4f8;
        text-align: center;
        padding-top: 70px;
    }

    .calculator {
        background-color: #ffffff;
        width: 400px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 12px #cfd8dc;
    }

    input {
        width: 80%;
        padding: 12px;
        margin: 10px;
        font-size: 16px;
        border: 1px solid #c5d5df;
        border-radius: 6px;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: #8bb8d1;
    }

    button {
        padding: 11px 22px;
        margin: 5px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background-color: #b8d8e8;
        color: #23404d;
    }

    button:hover {
        background-color: #a4c9dc;
    }

    .result {
        margin-top: 25px;
        font-size: 22px;
        font-weight: bold;
        color: #34515e;
    }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <form method="POST">

            <input type="number" step="any" name="a" placeholder="Enter first number" required>

            <input type="number" step="any" name="b" placeholder="Enter second number" required>

            <br><br>

            <button type="submit" name="operation" value="add">+</button>
            <button type="submit" name="operation" value="sub">-</button>
            <button type="submit" name="operation" value="mul">*</button>
            <button type="submit" name="operation" value="div">/</button>

        </form>

        {% if result is not none %}

        <div class="result">
            Result = {{ result }}
        </div>

        {% endif %}

    </div>

</body>

</html>
